# nether-supervisor config (key = value; '#' comments). Read from the process
# cwd, like nether's nether.conf. All keys have defaults; override as needed.

# North control socket that swerver's wasm_control_socket dials.
control_socket = /tmp/nsup/control.sock

# Directory for per-VM data_sockets. MUST match the swerver route's socket_dir
# (the trust boundary). Keep it SHORT (AF_UNIX sun_path is ~104 bytes on macOS).
socket_dir = /tmp/nsup

# Per-VM working directories (each holds a generated nether.conf + kernels/ link).
work_root = /tmp/nsup/vms

# Shared kernels dir to link into each VM cwd (nether reads kernels/ from cwd).
# kernels_dir = /absolute/path/to/nether/kernels

# Nonempty enables a fresh startup bake at <work_root>/00000000/base.snap.
# The supplied path is not loaded/reused. Unset => cold-boot each new VM.
# base_snap = /tmp/nsup/base.snap

# Path to the codesigned nether binary (real launcher).
# nether_bin = /absolute/path/to/nether/zig-out/bin/nether

launcher_mode = real          # parsed but unused; fake is not implemented
app_port      = 8080
# Set true when the guest image starts its own service during /init (for example,
# a Swerver guest). The cold base still receives a real HTTP readiness probe
# before snapshot; restored forks preserve their first request for the caller.
guest_service_prestarted = false
cpus          = 1
ram_mb        = 512           # size requirements depend on the guest image
max_vms       = 16
idle_ttl_ms   = 60000         # delegated to Nether; open data/egress connections protect the VM
idle_timeout_s = 90           # smaller enabled idle limit wins; both zero disables idle expiry
boot_budget_ms = 30000

# Optional status/metrics HTTP surface (empty addr => off).
# status_addr = 127.0.0.1:9190
# status_service_key = change-me
